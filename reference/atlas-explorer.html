<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas reference explorer</title>
<style>
:root{
  --paper:#EEF2F4; --panel:#FFFFFF; --ink:#13212E; --muted:#56687A; --rule:#D3DCE2;
  --coolant:#0B7480; --coolant-soft:#DDEFF1; --coolant-ink:#075A63;
  --amber:#9A5F0E; --amber-soft:#FAEED8; --over:#A23B2C; --over-soft:#F8E3DF;
  --radius-lg:14px; --radius-sm:6px;
  --font:"Avenir Next","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--coolant);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 28px 12px}
header.top h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
header.top p{margin:0;color:var(--muted);font-size:13px}

/* ---------- layout ---------- */
main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;padding:0 28px 40px;align-items:start}
@media (max-width:980px){main{grid-template-columns:1fr;padding:0 16px 32px} header.top{padding:16px} footer.foot{grid-column:1}}

/* ---------- inputs ---------- */
aside.inputs{background:var(--panel);border-radius:var(--radius-lg);padding:18px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:980px){aside.inputs{position:static;max-height:none}}
.field{margin-bottom:18px}
.field > label,.field > .label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .hint{font-size:12.5px;color:var(--muted);margin-top:6px}
select,input[type=number]{width:100%;border:1px solid var(--rule);border-radius:var(--radius-sm);padding:8px 10px;background:#fff}
.seg{display:flex;gap:4px;background:var(--paper);padding:3px;border-radius:8px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed=true]{background:#fff;font-weight:600;box-shadow:0 0 0 1px var(--rule)}
.plist{display:flex;flex-direction:column;gap:6px}
.pcard{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:1px solid var(--rule);background:#fff;border-radius:8px;padding:9px 11px;cursor:pointer}
.pcard[aria-checked=true]{border-color:var(--coolant);box-shadow:inset 3px 0 0 var(--coolant);background:var(--coolant-soft)}
.pcard[disabled]{cursor:not-allowed;opacity:.5}
.pcard .pname{font-weight:600;font-size:14px}
.pcard .pmeta{grid-column:1 / -1;font-size:12.5px;color:var(--muted)}
.vendor-head{font-size:12.5px;color:var(--muted);margin:10px 0 2px}
.vendor-head:first-child{margin-top:0}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.presets button:hover{border-color:var(--coolant)}

/* ---------- tags ---------- */
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:999px;white-space:nowrap;line-height:1.6}
.tag.ship{background:var(--coolant-soft);color:var(--coolant-ink)}
.tag.ramp{background:#E7ECF6;color:#33456E}
.tag.ann{background:var(--amber-soft);color:var(--amber)}
.tag.est{background:var(--amber-soft);color:var(--amber)}
.tag.rec{background:var(--coolant);color:#fff}
.tag.warn{background:var(--over-soft);color:var(--over)}

/* ---------- why? links ---------- */
.why{border:0;background:none;padding:0 2px;margin-left:4px;color:var(--coolant);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;white-space:nowrap}
.why:hover{color:var(--coolant-ink)}

/* ---------- results ---------- */
section.results{min-width:0}
.headline{background:var(--panel);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:16px}
.headline h2{margin:0 0 4px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.headline .sub{color:var(--muted);font-size:14px;margin:0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:16px;border-top:1px solid var(--rule)}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{padding:12px 14px 4px 0}
.fact .k{font-size:12.5px;color:var(--muted)}
.fact .v{font-size:24px;font-weight:600;line-height:1.25}
.fact .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:2px}
.fact .d{font-size:12.5px;color:var(--muted)}

.opts-head{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px;gap:12px;flex-wrap:wrap}
.opts-head h3{margin:0;font-size:16px;font-weight:600}
.opts-head p{margin:0;color:var(--muted);font-size:13px}
.option{background:var(--panel);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:12px;border-left:4px solid transparent}
.option.best{border-left-color:var(--coolant)}
.option header{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.option header h4{margin:0;font-size:16px;font-weight:600}
.option .tech{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.verdict{margin:14px 0 6px;font-size:14.5px}
.verdict strong{font-weight:600}

/* ---------- ceiling gauge (the one memorable element) ---------- */
.gauge{margin:12px 0 4px}
.gauge svg{display:block;width:100%;height:56px;overflow:visible}
.gauge .cap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:2px;gap:12px;flex-wrap:wrap}

.netgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:10px;border-top:1px solid var(--rule)}
@media (max-width:760px){.netgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.netgrid .fact .v{font-size:19px}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:760px){.alts{grid-template-columns:1fr}}
.alt{border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.alt h5{margin:0 0 2px;font-size:14px;font-weight:600}
.alt p{margin:0;font-size:13px;color:var(--muted)}
.alt dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:8px 0 0;font-size:13.5px}
.alt dt{color:var(--muted)} .alt dd{margin:0;text-align:right}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}
.note.warn{color:var(--over)}
.more{border:1px solid var(--rule);background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13.5px}
.empty{background:var(--panel);border-radius:var(--radius-lg);padding:28px 22px}
.empty h2{margin:0 0 6px;font-size:18px}
footer.foot{grid-column:2;font-size:12.5px;color:var(--muted);padding-top:8px}

/* ---------- overlay ---------- */
dialog{border:0;border-radius:var(--radius-lg);padding:0;max-width:640px;width:calc(100% - 32px);color:var(--ink);box-shadow:0 20px 60px rgba(19,33,46,.28)}
dialog::backdrop{background:rgba(19,33,46,.45)}
.dlg{padding:22px 26px 20px;max-height:min(80vh,760px);overflow:auto}
.dlg h2{margin:0 26px 6px 0;font-size:19px;font-weight:600;line-height:1.3}
.dlg .lead{margin:0 0 14px;color:var(--coolant-ink);font-size:15px}
.dlg .body p{margin:0 0 10px}
.dlg .body ul,.dlg .body ol{margin:0 0 12px;padding-left:20px}
.dlg .body li{margin-bottom:4px}
.dlg .body table{border-collapse:collapse;margin:4px 0 12px;font-size:14px}
.dlg .body th,.dlg .body td{border-bottom:1px solid var(--rule);padding:4px 14px 4px 0;text-align:left}
.dlg .eng{margin-top:16px;padding-top:12px;border-top:1px solid var(--rule)}
.dlg .eng h3{margin:0 0 6px;font-size:13.5px;font-weight:600}
.dlg .eng ul{margin:0;padding-left:18px;font-size:13.5px}
.dlg .eng a{color:var(--coolant-ink)}
#why .close{position:absolute;z-index:1;top:12px;right:12px;border:0;background:var(--paper);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:18px;line-height:1}
@media (prefers-reduced-motion:no-preference){
  dialog[open]{animation:pop .16s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@media print{aside.inputs,.why,.more{display:none} main{grid-template-columns:1fr} body{background:#fff}}
</style>
</head>
<body>
<header class="top">
  <h1>AI factory sizing</h1>
  <p id="asof"></p>
</header>
<main>
  <aside class="inputs" aria-label="Customer requirements">
    <div class="field">
      <span class="label" id="vendor-l">Vendor</span>
      <div class="seg" role="group" aria-labelledby="vendor-l" id="vendor"></div>
    </div>
    <div class="field">
      <label for="workload">Main workload</label>
      <select id="workload"></select>
    </div>
    <div class="field">
      <span class="label" id="plat-l">Platform</span>
      <div class="plist" role="radiogroup" aria-labelledby="plat-l" id="platforms"></div>
    </div>
    <div class="field">
      <label for="size" id="size-l">Cluster size (GPUs)</label>
      <input type="number" id="size" min="1" step="1" inputmode="numeric">
      <div class="presets" id="presets"></div>
      <div class="hint num" id="size-hint"></div>
    </div>
    <div class="field" id="density-f">
      <label for="density">Rack density</label>
      <select id="density"></select>
    </div>
    <div class="field" id="profile-f">
      <label for="profile">Power profile</label>
      <select id="profile"></select>
    </div>
    <div class="field">
      <label for="storage">Storage</label>
      <select id="storage"></select>
    </div>
    <div class="field">
      <label for="frontend">Front-end CPU</label>
      <select id="frontend"></select>
    </div>
  </aside>
  <section class="results" id="results" aria-live="polite"></section>
  <footer class="foot" id="foot"></footer>
</main>

<dialog id="why" aria-labelledby="why-title">
  <button class="close" id="why-close" aria-label="Close">×</button>
  <div class="dlg">
    <h2 id="why-title"></h2>
    <p class="lead" id="why-lead"></p>
    <div class="body" id="why-body"></div>
    <div class="eng" id="why-eng"></div>
  </div>
</dialog>

2 systems","systems":32,"gpus":96,"compute_racks":32,"rack_kw_typ":110,"compute_kw_typ":3520,"compute_kw_peak":3680,"it_kw":3911.1,"facility_kw":4693.3,"pue":1.2,"storage_read_GBps":96,"storage_usable_PB":0.768,"frontend_vcpu":960,"id":"cs4-vendor:n32","topology":"vendor-defined","tiers":null,"pods":1,"switches":null,"switch_kw":null,"transceiver_ends_800g_eq":null,"tradeoff":null,"explain":{"scale_point":"cerebras-fabric","rack_kw_typ":"rack-power-density","it_kw":"power-90-10","facility_kw":"pue","storage_read_GBps":"storage-bandwidth","storage_usable_PB":"storage-two-tiers","frontend_vcpu":"vcpu-per-gpu"}},{"platform_id":"cerebras-cs4","fabric_option_id":"cs4-vendor","scale_point":"n128","scale_label":"128 systems","systems":128,"gpus":384,"compute_racks":128,"rack_kw_typ":110,"compute_kw_typ":14080,"compute_kw_peak":14720,"it_kw":15644.4,"facility_kw":18773.3,"pue":1.2,"storage_read_GBps":384,"storage_usable_PB":3.072,"frontend_vcpu":3840,"id":"cs4-vendor:n128","topology":"vendor-defined","tiers":null,"pods":1,"switches":null,"switch_kw":null,"transceiver_ends_800g_eq":null,"tradeoff":null,"explain":{"scale_point":"cerebras-fabric","rack_kw_typ":"rack-power-density","it_kw":"power-90-10","facility_kw":"pue","storage_read_GBps":"storage-bandwidth","storage_usable_PB":"storage-two-tiers","frontend_vcpu":"vcpu-per-gpu"}}],"explainers":[{"id":"scale-up-vs-scale-out","topic":"network","title":"Two networks: one inside the {system_word}, one between them","summary":"GPUs use a very fast private link inside a {system_word} and a separate cluster network to reach every other {system_word}.","body":"An AI cluster has two kinds of network.\n\n**Scale-up** joins GPUs inside one {system_word} so they behave almost like one giant GPU. On {platform} this is {scale_up_tech}, linking {scale_up_domain} {accel_plural} together. It is extremely fast, but it only reaches as far as the {system_word}.\n\n**Scale-out** is the cluster network that connects every {system_word} to every other one. Each {accel_label} has its own {gbps_per_gpu_label} port into it. This is the network Atlas sizes, and it decides how big a single cluster can grow.\n\nA simple picture: scale-up is the corridors inside a building, scale-out is the road network between buildings.","links":[{"label":"NVIDIA developer blog — NVLink and NVLink Fusion for scale-up","url":"https://developer.nvidia.com/blog/scaling-ai-inference-performance-and-flexibility-with-nvidia-nvlink-and-nvlink-fusion/"},{"label":"NVIDIA GB300 NVL72 product page","url":"https://www.nvidia.com/en-us/data-center/gb300-nvl72/"},{"label":"NVIDIA DGX SuperPOD B300 (XDR) reference architecture — network design","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300-xdr/latest/dgx-superpod-architecture.html"}]},{"id":"non-blocking","topic":"network","title":"What “non-blocking” means","summary":"Every GPU can send at full speed to any other GPU at the same time, with no traffic jams inside the network.","body":"Picture a motorway junction where every on-ramp has a matching off-ramp: however the traffic is spread, no lane is ever overloaded.\n\nA non-blocking network is built the same way. Every switch has as much capacity going up towards the core as it has coming in from the GPUs below. So when half the GPUs all send to the other half at once — which is exactly what large training jobs do — every GPU still gets its full speed.\n\nCheaper designs share the uplinks (for example 2:1, half the capacity going up). That is often fine for inference, but a training job waits for its slowest link, and expensive GPUs sit idle.\n\nAll Atlas reference configurations are non-blocking.","links":[{"label":"Al-Fares et al., A Scalable, Commodity Data Center Network Architecture (SIGCOMM 2008) — the fat-tree paper","url":"https://www.cs.princeton.edu/courses/archive/fall10/cos597B/papers/fattree-sigcomm08.pdf"},{"label":"NVIDIA DGX SuperPOD B300 (XDR) reference architecture — network design","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300-xdr/latest/dgx-superpod-architecture.html"}]},{"id":"ceiling-2tier","topic":"network","title":"Why the limit is {max_gpus_2tier} GPUs ({max_units_label})","summary":"The {switch} has {k} ports at {plane_gbps_label}; two layers of these switches connect at most {k} × {half_k} = {max_gpus_2tier} GPUs.","body":"The cluster network is built from switches in two layers:\n\n- **Leaf switches**, where the GPUs plug in.\n- **Spine switches**, which connect every leaf to every other leaf.\n\nEvery GPU is then at most three switches away from any other GPU (leaf → spine → leaf), which keeps delays short and predictable.\n\nThe {switch} has **{k} ports** at {plane_gbps_label}. To stay non-blocking, each leaf uses half its ports ({half_k}) for GPUs and the other half ({half_k}) to reach the spines. A spine also has {k} ports, so it can connect at most {k} leaves.\n\nSo the largest two-layer network is {k} leaves × {half_k} GPUs = **{max_gpus_2tier} GPUs**.{plane_note} {units_sentence}{leaf_fit}\n\nTo grow further you need a third layer of switches or a second, separate cluster — see “Growing past the two-layer limit”.","links":[{"label":"Al-Fares et al., A Scalable, Commodity Data Center Network Architecture (SIGCOMM 2008) — the fat-tree paper","url":"https://www.cs.princeton.edu/courses/archive/fall10/cos597B/papers/fattree-sigcomm08.pdf"},{"label":"NVIDIA DGX SuperPOD B300 (XDR) reference architecture — network design","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300-xdr/latest/dgx-superpod-architecture.html"},{"label":"NVIDIA Quantum-X800 (XDR) clusters — deployment documentation","url":"https://docs.nvidia.com/networking/nvidia-quantum-x800-xdr-clusters/index.html"}]},{"id":"multiplane","topic":"network","title":"How multiplane lifts the limit {multiplier}","summary":"Each GPU's {gbps_per_gpu_label} is split into {planes_word} links of {plane_gbps_label}, so each switch offers {k} smaller ports instead of {k_alt} — and the limit grows with the square of the port count.","body":"A switch has a fixed total capacity. The {switch} can present it as **{k_alt} fast ports** or as **{k} slower ports**.\n\nA two-layer network connects (ports × ports) ÷ 2 GPUs, so the number of ports matters far more than their speed:\n\n- {k_alt} ports → {alt_ceiling} GPUs\n- {k} ports → {max_gpus_2tier} GPUs\n\nMultiplane uses the second option. Each GPU's network card splits its {gbps_per_gpu_label} into {planes_word} links of {plane_gbps_label}, and each link goes to its own independent two-layer network, called a *plane*. The GPU still gets its full {gbps_per_gpu_label}, spread across the planes, and the number of optics per GPU stays about the same.\n\nThe result is a much bigger cluster without a third layer of switches. {balance_note}","links":[{"label":"NVIDIA developer blog — multiplane topology and plane load balancing","url":"https://developer.nvidia.com/blog?p=121595"},{"label":"Spectrum-X multiplane explained (NADDOD)","url":"https://www.naddod.com/ai-insights/spectrum-x-multiplane-explained"},{"label":"NVIDIA developer blog — giga-scale AI Ethernet with Spectrum-X","url":"https://developer.nvidia.com/blog/giga-scale-ai-ethernet-evolution-spectrum-x-ethernet-rewrites-rules/"}]},{"id":"single-plane-trap","topic":"network","title":"Why single 800G Ethernet stops at {max_gpus_2tier} GPUs","summary":"Run at 800G, the {switch} has only {k} ports, so two layers top out at {max_gpus_2tier} GPUs; the same switch split into 200G links reaches {ceil_200}.","body":"The {switch} has the same total capacity whichever way its ports are configured, but at 800G it offers only **{k} ports**. Two layers of {k}-port switches connect at most {k} × {half_k} = **{max_gpus_2tier} GPUs** — only {max_units_label}.\n\nAnything bigger needs a third layer of switches, which is expensive.\n\nConfigured as 200G ports, the same switch offers **{k_200} ports**, and a multiplane design (four 200G planes per GPU) reaches **{ceil_200} GPUs** at two layers. That is why single-plane 800G is only proposed for small clusters.","links":[{"label":"NVIDIA developer blog — multiplane topology and plane load balancing","url":"https://developer.nvidia.com/blog?p=121595"},{"label":"Spectrum-X multiplane explained (NADDOD)","url":"https://www.naddod.com/ai-insights/spectrum-x-multiplane-explained"}]},{"id":"rubin-two-planes","topic":"network","title":"Why each Rubin GPU connects to {planes_word} networks","summary":"A Rubin GPU has {gbps_per_gpu_label} of network bandwidth but each switch port runs at {plane_gbps_label}, so every GPU connects to {planes_word} identical networks in parallel.","body":"The ConnectX-9 card gives each Rubin GPU {gbps_per_gpu_label}, twice the 800 Gb/s of the Blackwell generation. Each port on the {switch} runs at {plane_gbps_label}, so every GPU uses {planes_word} ports and joins {planes_word} identical, separate networks (planes).\n\nEach plane is a normal two-layer network of {k}-port switches, so the cluster limit stays at **{max_gpus_2tier} GPUs ({max_units_label})** — the same as the previous generation. But you buy **{planes_times} the switches and optics**, because there is {planes_times} the bandwidth to carry.\n\nOn Spectrum-X Ethernet, the same 1.6 Tb/s can instead be split into eight 200G planes, which keeps two layers up to 131,072 GPUs.","links":[{"label":"Gigabyte Vera Rubin NVL72 rack specification","url":"https://www.gigabyte.com/Enterprise/GIGAPOD-Rack-Scale/AI-DLC-Rack_NVIDIA-Vera-Rubin-NVL72"},{"label":"NVIDIA Quantum-X800 InfiniBand platform","url":"https://nvidia.com/en-us/networking/products/infiniband/quantum-x800"},{"label":"Spectrum-X multiplane explained (NADDOD)","url":"https://www.naddod.com/ai-insights/spectrum-x-multiplane-explained"}]},{"id":"fabric-infiniband","topic":"network","title":"InfiniBand: built for one giant training job","summary":"NVIDIA InfiniBand is a dedicated AI and HPC network with the most predictable performance and maths done inside the switches — the reference choice for large single training jobs.","body":"InfiniBand was designed for supercomputers. Switches and network cards come from NVIDIA and work as one system, managed centrally.\n\nWhy customers choose it:\n\n- **Predictable speed.** Built-in congestion control and adaptive routing keep every GPU busy during the large, synchronised data exchanges of training.\n- **Maths inside the network (SHARP).** The switches combine results from many GPUs on the fly, which shortens each training step.\n- **Proven at scale.** It is the default in NVIDIA's DGX SuperPOD reference designs.\n\nTrade-offs: a single vendor, a skill set separate from the customer's Ethernet teams, and multi-tenant isolation that is less flexible than Ethernet.","links":[{"label":"NVIDIA Quantum-X800 InfiniBand platform","url":"https://nvidia.com/en-us/networking/products/infiniband/quantum-x800"},{"label":"NVIDIA Quantum-X800 (XDR) clusters — deployment documentation","url":"https://docs.nvidia.com/networking/nvidia-quantum-x800-xdr-clusters/index.html"},{"label":"NVIDIA DGX SuperPOD documentation","url":"https://docs.nvidia.com/dgx-superpod/"}]},{"id":"fabric-spectrum-x","topic":"network","title":"Spectrum-X: Ethernet tuned for AI","summary":"NVIDIA Spectrum-X is Ethernet with AI features built into the switch and the network card, giving close to InfiniBand performance with Ethernet tools and multi-tenancy.","body":"Ordinary Ethernet slows down under the bursty, everyone-at-once traffic of AI training. Spectrum-X fixes this by making the NVIDIA switch and the NVIDIA SuperNIC (network card) work as a pair: traffic is spread across all available paths, put back in order at the receiver, and senders slow down before queues build up.\n\nWhy customers choose it:\n\n- Familiar Ethernet operations, tools and security controls.\n- Strong separation between tenants — a natural fit for GPU clouds serving many customers.\n- Multiplane designs reach the largest flat clusters.\n\nTrade-off: these AI features need NVIDIA switches **and** NVIDIA SuperNICs end to end. Mixing in third-party parts gives ordinary RoCE performance.","links":[{"label":"NVIDIA Spectrum-X Ethernet platform","url":"https://nvidia.com/en-us/networking/spectrumx"},{"label":"NVIDIA developer blog — giga-scale AI Ethernet with Spectrum-X","url":"https://developer.nvidia.com/blog/giga-scale-ai-ethernet-evolution-spectrum-x-ethernet-rewrites-rules/"},{"label":"NVIDIA developer blog — multiplane topology and plane load balancing","url":"https://developer.nvidia.com/blog?p=121595"}]},{"id":"fabric-open-ethernet","topic":"network","title":"Open Ethernet (RoCEv2 / Ultra Ethernet)","summary":"Standard Ethernet switches from several vendors carry GPU traffic directly between GPUs; this is the path for AMD clusters and multi-vendor builds.","body":"RoCE (RDMA over Converged Ethernet) lets GPUs exchange data directly over standard Ethernet switches, such as Broadcom Tomahawk-based models from Arista, Cisco, Juniper and others. Ultra Ethernet (UEC) is the new industry standard that improves how this traffic is spread and how congestion is handled; AMD's Pensando Pollara and Vulcano network cards are built for it.\n\nWhy customers choose it:\n\n- Choice of switch vendor and price competition.\n- One Ethernet skill set across the data centre.\n- The natural network for AMD Instinct GPUs.\n\nTrade-offs: performance depends on careful tuning (or on UEC support at both ends), and it is not NVIDIA-validated for NVIDIA GPU clusters, so NVIDIA reference designs and support do not apply.","links":[{"label":"Ultra Ethernet Consortium — Specification 1.0 announcement","url":"https://www.linuxfoundation.org/press/uec-launches-spec-1.0"},{"label":"AMD Pensando AI NICs (Pollara, Vulcano)","url":"https://amd.com/en/products/network-interface-cards/pensando.html"},{"label":"AMD Pensando Pollara 400 product brief (PDF)","url":"https://www.amd.com/content/dam/amd/en/documents/pensando-technical-docs/product-briefs/pensando-pollara-400-product-brief.pdf"}]},{"id":"cerebras-fabric","topic":"network","title":"Cerebras supplies its own network","summary":"Cerebras designs and delivers the network for its clusters, so InfiniBand versus Ethernet is not a choice the customer makes.","body":"A Cerebras system keeps the model's working data on the wafer itself, so it exchanges far less data with its neighbours than a GPU cluster does. Cerebras designs the network around this and ships it as part of the cluster, in dedicated network cabinets.\n\nWhat sales needs to know:\n\n- Size with Cerebras: choose the number of systems, and Cerebras supplies the network.\n- {platform} clusters can grow to {vendor_max_label}.\n- Atlas power figures for Cerebras clusters already include the network cabinets.","links":[{"label":"Cerebras CS-3 16-node inference cluster specification (flopper.io)","url":"https://flopper.io/system/cerebras-cs-3-cluster-16-node"},{"label":"Futurum — Cerebras CS-4 analysis","url":"https://futurumgroup.com/insights/cerebras-cs-4-makes-the-rack-the-new-chip-by-doubling-power-and-tripling-wafers/"}]},{"id":"beyond-2tier","topic":"network","title":"Growing past the two-layer limit","summary":"Beyond {max_gpus_2tier} GPUs you either build separate clusters (cheapest) or add a third layer of switches (one big cluster, much more expensive).","body":"Once the two-layer network is full ({max_gpus_2tier} GPUs here), there are three main ways to grow:\n\n1. **Separate clusters (pods).** Build a second, identical network. The cost per GPU stays the same. The catch: one job cannot use both pods at full speed. Ideal for GPU clouds and for customers running many jobs.\n2. **A third layer of switches.** One flat network for one giant job. It needs about 67% more switches and 50% more optics per GPU, adds delay, and the extra optics add power and parts that can fail.\n3. **Multiplane (Ethernet).** Split each GPU into several slower links so the same switches reach many more GPUs while staying at two layers.\n\nA fourth, cheaper variant shares capacity in the third layer (for example 2:1). It suits inference but slows large training jobs.","links":[{"label":"NVIDIA developer blog — multiplane topology and plane load balancing","url":"https://developer.nvidia.com/blog?p=121595"},{"label":"Al-Fares et al., A Scalable, Commodity Data Center Network Architecture (SIGCOMM 2008) — the fat-tree paper","url":"https://www.cs.princeton.edu/courses/archive/fall10/cos597B/papers/fattree-sigcomm08.pdf"}]},{"id":"three-tier-cost","topic":"network","title":"Why a third layer of switches costs so much more","summary":"Two layers need about 3 switches for every {k} GPUs; three layers need about 5 — roughly 67% more switches and 50% more optics per GPU.","body":"Count the switches needed for every {k} GPUs (per plane), keeping the network non-blocking:\n\n- **Two layers:** 2 leaf switches (each with {half_k} GPUs) and 1 spine → **3 switches**.\n- **Three layers:** the same 2 leaves, 2 more “aggregation” switches above them, and 1 core switch on top → **5 switches**.\n\n5 ÷ 3 is about **+67% switches**. The cabling follows the same logic: two layers need two links per GPU path (GPU → leaf, leaf → spine), three layers need three (plus aggregation → core), so about **+50% optics** — and optics are a large part of network cost and power.\n\nMessages also cross up to five switches instead of three, which adds delay. That is why the two-layer limit is the natural size for one cluster.","links":[{"label":"Al-Fares et al., A Scalable, Commodity Data Center Network Architecture (SIGCOMM 2008) — the fat-tree paper","url":"https://www.cs.princeton.edu/courses/archive/fall10/cos597B/papers/fattree-sigcomm08.pdf"},{"label":"NVIDIA developer blog — multiplane topology and plane load balancing","url":"https://developer.nvidia.com/blog?p=121595"}]},{"id":"optics-count","topic":"network","title":"Why Atlas counts optics (transceivers)","summary":"Every fibre link needs a transceiver at each end; in large clusters they number in the tens of thousands and drive much of the network's cost, power and failures.","body":"Links that leave a rack run over fibre, and each end of the fibre plugs into a transceiver (an “optic”) that turns electrical signals into light. A modern 800G optic draws roughly 12 to 16 watts, and a large cluster needs tens of thousands of them.\n\nAtlas counts transceiver ends in 800G equivalents so options can be compared fairly. A two-layer non-blocking network needs about 4 for each 800G of GPU bandwidth (two ends on GPU → leaf, two on leaf → spine); a three-layer network needs about 6.\n\nNewer switches with co-packaged optics, such as Spectrum-6 and the Quantum-X Photonics models, build the optics into the switch itself. This cuts power and the number of separate parts that can fail.","links":[{"label":"Spectrum-6 SN6810 / SN6800 deep dive (NADDOD)","url":"https://www.naddod.com/fr/ai-insights/spectrum-6-ethernet-switch-deep-dive-sn6810-102-4t-and-sn6800-409-6t-switch"},{"label":"NVIDIA Quantum-X800 InfiniBand platform","url":"https://nvidia.com/en-us/networking/products/infiniband/quantum-x800"}]},{"id":"scalable-unit","topic":"network","title":"What a scalable unit (SU) is","summary":"A standard, pre-designed building block of {su_label} that is repeated to grow a cluster.","body":"Large clusters are built by repeating an identical, pre-designed block called a scalable unit (SU). Each SU has the same compute, cabling, leaf switches and power layout, so every extra block is a copy rather than a new design.\n\nFor {platform} the SU in Atlas is **{su_label}**. It is a sensible minimum order to discuss and a clean unit for phased delivery: start with one or two SUs, then add more up to the two-layer limit of {max_units_label}.\n\nBecause the SU is a fixed design, its power and network figures are the most reliable starting point for a first quote.","links":[{"label":"NVIDIA DGX SuperPOD B300 reference architecture (PDF)","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300/latest/_downloads/5fe4960ce43a21f33d6a5919d57bd583/RA11337001-DSPB300-ReferenceArch.pdf"},{"label":"NVIDIA DGX SuperPOD — key components","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300/latest/dgx-superpod-components.html"}]},{"id":"rack-scale-vs-server","topic":"platform","title":"Rack-scale systems vs 8-GPU servers","summary":"{platform} is sold {form_phrase}; that choice drives density, cooling and how many GPUs can work as one.","body":"There are two ways to package AI accelerators:\n\n- **8-GPU servers** (HGX B200 / B300, HGX Rubin NVL8, AMD MI350X / MI355X / MI440X). Eight GPUs share a very fast link inside the server. They fit standard racks, some can still be air-cooled, and you buy them one server at a time.\n- **Rack-scale systems** (GB300 NVL72, Vera Rubin NVL72, AMD Helios). 72 GPUs in one rack share the fast link, so they act like one very large GPU. This is much better for the largest models and for fast inference of big models, but the rack is one unit: it needs liquid cooling and 130 to 245 kW of power, and it is ordered whole.\n\n{platform} is sold {form_phrase}.","links":[{"label":"NVIDIA HGX platform (B200, B300, Rubin NVL8)","url":"https://www.nvidia.com/en-us/data-center/hgx/"},{"label":"NVIDIA GB300 NVL72 product page","url":"https://www.nvidia.com/en-us/data-center/gb300-nvl72/"}]},{"id":"what-is-nvl72","topic":"platform","title":"What “NVL72” means","summary":"NVL72 means 72 GPUs in one rack joined by NVLink, so the whole rack works like one giant GPU with {rack_memory_label} of fast memory.","body":"“NVL72” is NVIDIA's name for a rack holding **72 GPUs** and their CPUs, all joined by NVLink switches inside the rack. Any GPU can read another GPU's memory almost as fast as its own.\n\nWhy it matters to the customer:\n\n- Very large models fit inside one rack ({rack_memory_label} of GPU memory on {platform}).\n- Large-model inference is much faster, because the GPUs share work without going over the slower cluster network.\n- The rack is delivered pre-built and tested, then connected to power, cooling water and the cluster network.\n\nEach GPU still has its own {gbps_per_gpu_label} port into the cluster network, so one rack needs {accel_per_system} network connections. That is what sets the cluster size limit.","links":[{"label":"NVIDIA GB300 NVL72 product page","url":"https://www.nvidia.com/en-us/data-center/gb300-nvl72/"},{"label":"Lenovo Press — GB300 NVL72 rack-scale AI product guide","url":"https://lenovopress.lenovo.com/lp2357-lenovo-nvidia-gb300-nvl72-rack-scale-ai"},{"label":"Vera Rubin NVL72 specifications (CUDO)","url":"https://www.cudocompute.com/products/nvidia-vera-rubin"}]},{"id":"what-is-helios","topic":"platform","title":"What AMD Helios is","summary":"AMD's answer to NVL72: 72 MI455X GPUs in one double-wide rack, joined by the open UALink standard, with {rack_memory_label} of HBM4 memory.","body":"Helios is AMD's first rack-scale system. Like NVIDIA's NVL72 it joins **72 GPUs** in one rack so they act as one, but it is built on open standards: UALink inside the rack, Ultra Ethernet between racks, and the Open Compute “Open Rack Wide” double-width cabinet.\n\nPoints for the conversation:\n\n- **Memory:** {hbm_label} per GPU, about 50% more than a Vera Rubin GPU — attractive for large-model inference.\n- **Power and space:** {rack_kw_typ}–{rack_kw_peak} kW per rack, and roughly twice the floor area of an NVL72 rack.\n- **Timing:** {availability}. Confirm delivery dates before committing.","links":[{"label":"AMD Helios rack-scale platform","url":"https://www.amd.com/en/products/rackscale-solutions/helios.html"},{"label":"Supermicro AMD Helios datasheet (PDF)","url":"https://www.supermicro.com/datasheet/datasheet_AMD_Helios.pdf"}]},{"id":"cerebras-wafer","topic":"platform","title":"Why Cerebras is different: a wafer, not a GPU","summary":"Cerebras builds one processor the size of a whole silicon wafer, with its memory on the chip, which makes it extremely fast at generating answers.","body":"A normal GPU is cut from a silicon wafer. Cerebras keeps the whole wafer as one giant processor (the Wafer Scale Engine). Its working memory ({hbm_label}) sits on the chip itself, so it reads model data far faster than a GPU reading from separate memory.\n\nWhat it means for customers:\n\n- **Speed per user:** very high tokens per second — ideal for premium real-time and agent services.\n- **Different sizing:** count systems and racks, not GPUs. {platform} holds {accel_per_system} {accel_plural}.\n- **Vendor-led design:** Cerebras supplies the network and sizes the cluster with you.\n\nIt complements GPU clusters rather than replacing them; most customers run the bulk of their work on GPUs.","links":[{"label":"Futurum — Cerebras CS-4 analysis","url":"https://futurumgroup.com/insights/cerebras-cs-4-makes-the-rack-the-new-chip-by-doubling-power-and-tripling-wafers/"},{"label":"Cerebras CS-3 rack specification (flopper.io)","url":"https://flopper.io/system/cerebras-cs-3-rack"}]},{"id":"fp64-hpc","topic":"platform","title":"Why {platform} is not the lead for classic HPC","summary":"Scientific simulation needs double-precision (FP64) maths; AI-focused chips put their silicon into the much smaller number formats AI uses.","body":"Scientific simulation (weather, physics, engineering) mostly uses 64-bit “double precision” (FP64) arithmetic. AI uses much smaller number formats (FP8, FP4).\n\nRecent AI-focused chips put most of their silicon into the AI formats. NVIDIA's Blackwell Ultra (B300, GB300) cut FP64 sharply, and the Rubin generation and AMD's MI455X / MI440X are positioned for AI. Confirm their FP64 figures before any HPC bid.\n\nFor HPC customers, lead with **AMD MI355X / MI350X** (strong FP64) or **NVIDIA HGX B200**, and check the customer's application list. AMD's MI430X (2027) is the next FP64-focused part.","links":[{"label":"The Register — AMD MI355X and MI350X","url":"https://www.theregister.com/2025/06/12/amd_mi355x/"},{"label":"NVIDIA HGX platform (B200, B300, Rubin NVL8)","url":"https://www.nvidia.com/en-us/data-center/hgx/"}]},{"id":"hbm-memory","topic":"platform","title":"Why GPU memory size matters","summary":"{platform} has {hbm_label} per {accel_label}; more memory means bigger models and more simultaneous users per GPU.","body":"Each GPU has its own very fast memory (HBM). The model's weights, plus the working memory of every conversation in progress (the “KV cache”), must fit in it.\n\nMore memory per GPU means:\n\n- Larger models run on fewer GPUs.\n- More users or longer documents can be served at once, which lowers the cost of each answer.\n\nRough guide: a 70-billion-parameter model needs about 70 GB at 8-bit precision just for its weights, before any users are added.\n\n{platform}: {hbm_label} per {accel_label}{rack_memory_sentence}.","links":[{"label":"NVIDIA GB300 NVL72 product page","url":"https://www.nvidia.com/en-us/data-center/gb300-nvl72/"},{"label":"Supermicro AMD Helios datasheet (PDF)","url":"https://www.supermicro.com/datasheet/datasheet_AMD_Helios.pdf"}]},{"id":"status-and-confidence","topic":"platform","title":"How sure are these numbers?","summary":"Each platform shows its availability and a confidence rating: published, partner or estimate.","body":"Atlas gives ballpark numbers for first conversations. Each platform carries two labels.\n\n**Availability**\n\n- *Shipping*: can be ordered today.\n- *Ramping*: in production but allocation-limited; delivery dates must be confirmed.\n- *Announced*: specifications are still preliminary.\n\n**Confidence**\n\n- *Published*: from the vendor's own datasheet.\n- *Partner*: from an OEM or cloud partner's datasheet.\n- *Estimate*: our engineering estimate where the vendor has not published a figure. Never quote these as committed values.\n\n{platform}: {availability}; data rated *{confidence}*.","links":[]},{"id":"rack-power-density","topic":"facility","title":"Why rack power is the first facility question","summary":"Each {platform} rack draws about {rack_kw_typ} kW — far above the 10–20 kW of a typical enterprise rack — so the data hall must be built for it.","body":"Power per rack decides whether a data centre can host a platform at all. Cables, busbars, cooling and floor loading are all designed for a maximum per rack.\n\n- Typical enterprise racks: 10–20 kW.\n- Air-cooled AI halls: about 40 kW, up to about 60 kW with rear-door heat exchangers.\n- Liquid-cooled AI halls: 130 kW and above.\n\n{platform} at its default density ({density_label}) draws about **{rack_kw_typ} kW** per rack{peak_phrase}. {cooling_sentence} {density_note}","links":[{"label":"GB300 NVL72 power specification (CUDO)","url":"https://www.cudocompute.com/products/nvidia-gb300/"},{"label":"Gigabyte Vera Rubin NVL72 rack specification","url":"https://www.gigabyte.com/Enterprise/GIGAPOD-Rack-Scale/AI-DLC-Rack_NVIDIA-Vera-Rubin-NVL72"},{"label":"HPE vs NVIDIA GB300 NVL72 — power and busway guidance (flopper.io)","url":"https://flopper.io/compare-systems/hpe-nvidia-gb300-nvl72-vs-nvidia-gb300-nvl72"}]},{"id":"liquid-vs-air","topic":"facility","title":"Liquid vs air cooling","summary":"Above roughly 40–60 kW per rack, air cannot carry the heat away; liquid flowing over the chips takes it off directly.","body":"**Air cooling** blows cold air through the servers. It works up to roughly 40 kW per rack, and to about 60 kW with rear-door heat exchangers (radiators fitted to the back of the rack).\n\n**Direct liquid cooling** puts metal “cold plates” on the GPUs and CPUs, with coolant flowing through them. A coolant distribution unit (CDU), in the rack or in the row, passes that heat to the building's water loop. Liquid carries heat far better than air, which makes 130–245 kW racks possible and reduces the energy spent on cooling.\n\nLiquid-cooled racks still release some heat into the room (around 10% for an NVL72), so the hall still needs some air cooling.\n\n{platform}: {cooling}.","links":[{"label":"DCD — ASHRAE liquid cooling guidelines","url":"https://www.datacenterdynamics.com/en/news/ashrae-publishes-liquid-cooling-guidelines-as-chip-power-moves-into-uncharted-territory/"},{"label":"StorageReview — ASHRAE TC 9.9 on direct-to-chip cooling loops","url":"https://www.storagereview.com/news/ashrae-tc-9-9-flags-four-ways-direct-to-chip-cooling-loops-go-wrong"},{"label":"Lenovo GB300 NVL72 — liquid / air heat split (flopper.io)","url":"https://flopper.io/compare-systems/lenovo-nvidia-gb300-nvl72-vs-nvidia-gb300-nvl72"}]},{"id":"typical-vs-peak","topic":"facility","title":"Typical vs peak power: provision for the peak","summary":"Racks briefly draw more than their typical power; the electrical supply must be sized for the peak ({rack_kw_peak} kW per rack here).","body":"The **typical** figure ({rack_kw_typ} kW per rack for {platform}) is what a rack draws on average under a heavy AI workload. It drives the energy bill and the cooling.\n\nThe **peak** ({rack_kw_peak} kW) is a short burst the rack can pull during intense phases — and when thousands of GPUs start the same training step together, those bursts line up. Breakers, busways and power shelves must handle the peak, or protection may trip and stop the cluster.\n\nRule of thumb for a first conversation: size energy and cooling on typical power, and the electrical distribution on the peak.","links":[{"label":"HPE vs NVIDIA GB300 NVL72 — power and busway guidance (flopper.io)","url":"https://flopper.io/compare-systems/hpe-nvidia-gb300-nvl72-vs-nvidia-gb300-nvl72"},{"label":"GB300 NVL72 power specification (CUDO)","url":"https://www.cudocompute.com/products/nvidia-gb300/"}]},{"id":"power-90-10","topic":"facility","title":"Where the power goes: the 90/10 rule","summary":"About 90% of IT power feeds the GPU racks; the other 10% covers network, storage, CPU servers and management.","body":"To size a cluster quickly, Atlas starts from the compute racks, which are by far the biggest load, and adds a fixed allowance for everything else:\n\n- **Compute racks** (GPUs and their host CPUs): about **90%** of IT power.\n- **Everything else** — network switches and optics, storage, front-end CPU servers, management: about **10%**.\n\nSo IT power = compute power ÷ 0.9. {ref_example}\n\nAtlas also adds up the switches, storage and CPU servers one by one as a cross-check. On rack-scale systems they fit within the 10%; with 8-GPU servers or a three-layer network they can exceed it, and Atlas flags those cases.","links":[{"label":"NVIDIA DGX SuperPOD B300 reference architecture (PDF)","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300/latest/_downloads/5fe4960ce43a21f33d6a5919d57bd583/RA11337001-DSPB300-ReferenceArch.pdf"}]},{"id":"pue","topic":"facility","title":"From IT power to facility power (PUE)","summary":"PUE = total facility power ÷ IT power. Atlas uses {pue} for this {cooling_word} configuration.","body":"A data centre uses extra power on top of the IT equipment: chillers, pumps, fans, power-conversion losses and lighting. Power Usage Effectiveness (PUE) captures this:\n\n**Facility power = IT power × PUE**\n\nA PUE of 1.0 would mean zero overhead. Modern liquid-cooled AI facilities reach about 1.1–1.3; air-cooled halls are typically 1.3–1.5, and higher in hot climates.\n\nAtlas uses **1.2 for liquid-cooled** and **1.4 for air-cooled** platforms. {pue_example}\n\nThe real figure depends on the site's climate and cooling design; use the site's design PUE when it is known.","links":[{"label":"TechTarget — Power Usage Effectiveness (PUE) definition","url":"https://www.techtarget.com/searchdatacenter/definition/power-usage-effectiveness-PUE"}]},{"id":"storage-two-tiers","topic":"storage","title":"Why storage comes in two tiers","summary":"A fast tier keeps the GPUs fed and saves progress quickly; a cheaper object tier holds the full data lake.","body":"GPUs read training data and save their progress (“checkpoints”) at enormous rates. Storage fast enough for that is expensive per terabyte, so clusters use two tiers:\n\n- **Performance tier** (VAST, WEKA, DDN, IBM and others): all-flash, connected directly to the GPU network and sized for **speed**. Atlas plans about {hot_training} TB per GPU for training and {hot_inference} TB per GPU for inference.\n- **Capacity tier** (object storage, S3): the full data lake, model library and older checkpoints, sized for **volume** — about {lake_training} TB per GPU for training and {lake_inference} TB per GPU for inference.\n\nSome platforms, VAST in particular, can serve both roles from one system; Atlas then adds no separate capacity tier when the fast tier already holds enough.","links":[{"label":"NVIDIA DGX SuperPOD B300 reference architecture (PDF)","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300/latest/_downloads/5fe4960ce43a21f33d6a5919d57bd583/RA11337001-DSPB300-ReferenceArch.pdf"},{"label":"VAST Data — storage requirements for DGX SuperPOD","url":"https://www.vastdata.com/blog/storage-requirements-nvidia-dgx-superpod"}]},{"id":"storage-bandwidth","topic":"storage","title":"How much storage speed a cluster needs","summary":"Atlas sizes the fast tier at {read_enhanced} GB/s of reads per GPU for training and {read_standard} GB/s for inference.","body":"If storage cannot deliver data fast enough, GPUs wait — and an idle GPU is the most expensive thing in the data centre.\n\nAtlas uses two levels:\n\n- **Enhanced** ({read_enhanced} GB/s per GPU): training, HPC and mixed workloads that read large datasets and save frequent checkpoints.\n- **Standard** ({read_standard} GB/s per GPU): inference and fine-tuning, which mainly load models and serve answers.\n\nWrite speed (for checkpoints) is taken as half the read speed. Example: 10,000 GPUs in training need about {example_read_tbs} TB/s of reads.\n\nThese are rules of thumb; storage vendors refine them with the customer's actual data and models.","links":[{"label":"NVIDIA DGX SuperPOD B300 reference architecture (PDF)","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300/latest/_downloads/5fe4960ce43a21f33d6a5919d57bd583/RA11337001-DSPB300-ReferenceArch.pdf"},{"label":"IBM Storage Scale System 6000 with DGX SuperPOD (reference design)","url":"https://www.ibm.com/downloads/documents/mx-es/10a998081d2fd561"},{"label":"Blocks & Files — how NVIDIA certifies SuperPOD storage","url":"https://blocksandfiles.com/2024/09/03/nvidia-superpod-storage-certification/"}]},{"id":"gpudirect-storage","topic":"storage","title":"GPUDirect Storage: data straight to the GPU","summary":"GPUDirect Storage lets data flow from storage straight into GPU memory without passing through the CPU.","body":"Normally, data read from storage lands in the server's CPU memory first and is then copied to the GPU. With GPUDirect Storage (GDS), the network card places it straight into GPU memory.\n\nBenefits: higher throughput, lower delay and less CPU load — which matters when each server reads tens of gigabytes per second.\n\nMost certified AI storage platforms support it; ask for it explicitly in storage proposals and confirm it for the chosen vendor.","links":[{"label":"NVIDIA GPUDirect Storage overview guide","url":"https://docs.nvidia.com/gpudirect-storage/overview-guide/index.html"}]},{"id":"storage-vendors","topic":"storage","title":"Choosing a storage vendor","summary":"Several vendors are certified by NVIDIA for its largest reference clusters; the right one depends on workload, tenancy and what the customer already runs.","body":"NVIDIA tests storage systems against its DGX SuperPOD reference designs. Certified vendors include DDN, Dell, IBM, NetApp, VAST Data and WEKA. A quick guide:\n\n- **VAST Data:** one system for files, objects and databases, with strong multi-tenancy — good for GPU clouds and sovereign platforms.\n- **WEKA:** very fast with many small files, and can extend GPU memory for inference (KV-cache offload).\n- **DDN:** raw throughput for checkpoint-heavy training, and a long HPC track record.\n- **IBM Storage Scale, NetApp, Dell:** a natural fit for customers already standardised on them.\n\nThe building-block figures in Atlas are estimates for first sizing; always get the vendor's own sizing.","links":[{"label":"Blocks & Files — how NVIDIA certifies SuperPOD storage","url":"https://blocksandfiles.com/2024/09/03/nvidia-superpod-storage-certification/"},{"label":"IBM Storage Scale System 6000 with DGX SuperPOD (reference design)","url":"https://www.ibm.com/downloads/documents/mx-es/10a998081d2fd561"},{"label":"WEKA — NVIDIA certified solutions","url":"https://www.weka.io/company/partners/technology-alliance-partners/nvidia"}]},{"id":"frontend-cpu","topic":"frontend","title":"Why a separate CPU front end?","summary":"CPU servers run everything around the GPUs — schedulers, logins, data preparation, APIs and databases — so the GPU servers only do GPU work.","body":"GPU servers have their own CPUs, but those are dedicated to feeding the GPUs. A complete AI platform also needs:\n\n- **Control plane:** Kubernetes or Slurm schedulers, monitoring, network and cluster management.\n- **Data preparation:** cleaning and tokenising training data.\n- **Serving layer:** API gateways, load balancers, retrieval (RAG) and vector databases.\n- **Agents:** sandboxes where AI agents run tools and code.\n\nThese run on standard CPU servers, typically dual-socket AMD EPYC. Atlas adds {control_plane_nodes} control-plane servers, plus capacity that scales with the number of GPUs.","links":[{"label":"NVIDIA DGX SuperPOD — key components","url":"https://docs.nvidia.com/dgx-superpod/reference-architecture/scalable-infrastructure-b300/latest/dgx-superpod-components.html"},{"label":"AMD EPYC 9006 'Venice' overview","url":"https://vrlatech.com/amd-epyc-9006-venice-zen-6-server-cpu/"}]},{"id":"vcpu-per-gpu","topic":"frontend","title":"How the CPU front end is sized","summary":"Atlas allows {vcpu_inference} virtual CPUs per GPU for inference, {vcpu_mixed} for mixed, {vcpu_fine_tuning} for fine-tuning and {vcpu_training} for training.","body":"Inference needs the most CPU around the GPUs: every request passes through gateways, retrieval and databases. Training needs the least, because the work happens mostly inside the GPU cluster.\n\n| Workload | vCPU per GPU |\n| --- | --- |\n| Inference | {vcpu_inference} |\n| Mixed | {vcpu_mixed} |\n| Fine-tuning | {vcpu_fine_tuning} |\n| Training / HPC | {vcpu_training} |\n\nExample: 1,000 GPUs for inference need {example_vcpu} vCPUs — about {example_nodes} dual-socket EPYC Turin servers of {turin_vcpu} vCPUs each, plus the control plane.\n\nThese are planning ratios; agent-heavy workloads can need several times more.","links":[{"label":"AMD EPYC 9006 'Venice' overview","url":"https://vrlatech.com/amd-epyc-9006-venice-zen-6-server-cpu/"}]}]};
</script>
<script>
/* ===== Sizing and explanation engines (generated from src/sizing.mjs + src/explain.mjs) ===== */
// Atlas sizing engine — pure functions, no dependencies.
// Import from the webapp (Next.js / Vite / Node 18+):
//   import { planCluster, fabricLimits } from "./sizing.mjs";
//   import * as DATA from "./data.mjs";   // or load data/*.json from the DB

const ceil = Math.ceil;
const floor = Math.floor;
const r1 = (x) => Math.round(x * 10) / 10;

function byId(list, id) {
  const hit = list.find((x) => x.id === id);
  if (!hit) throw new Error(`Unknown id: ${id}`);
  return hit;
}

function defaultRackOption(platform) {
  return platform.rack_options.find((o) => o.default) || platform.rack_options[0];
}

/** Radix (ports) of a switch at a given logical port speed. */
function radix(sw, gbps) {
  const k = sw.radix[gbps];
  if (!k) throw new Error(`${sw.id} has no ${gbps}G port mode`);
  return k;
}

/**
 * Scale limits of one fabric option.
 * Non-blocking folded Clos, per plane:
 *   1-tier = k, 2-tier = k^2/2, 3-tier = k^3/4 endpoints.
 * Each GPU has one port on every plane, so GPU limit = per-plane endpoint limit.
 */
function fabricLimits(fo, platform, sw, rackOpt = defaultRackOption(platform)) {
  const accelPerRack = platform.accel_per_system * rackOpt.systems_per_rack;
  if (!sw) {
    const maxSys = fo.vendor_max_systems ?? null;
    return {
      k: null,
      vendor_defined: true,
      max_gpus_1tier: null,
      max_gpus_2tier: maxSys ? maxSys * platform.accel_per_system : null,
      max_gpus_3tier: null,
      max_systems_2tier: maxSys,
      max_racks_2tier: maxSys ? floor(maxSys / rackOpt.systems_per_rack) : null,
    };
  }
  const k = radix(sw, fo.plane_gbps);
  const g1 = k;
  const g2 = (k * k) / 2;
  const g3 = (k * k * k) / 4;
  const sys2 = floor(g2 / platform.accel_per_system);
  return {
    k,
    vendor_defined: false,
    max_gpus_1tier: g1,
    max_gpus_2tier: g2,
    max_gpus_3tier: g3,
    max_systems_2tier: sys2,
    max_racks_2tier: floor(g2 / accelPerRack),
    max_systems_3tier: floor(g3 / platform.accel_per_system),
  };
}

/** Switch / link counts for N GPUs on one fabric (all planes). */
function fabricBill(N, fo, sw, tiers) {
  const k = radix(sw, fo.plane_gbps);
  const P = fo.planes;
  let leaf = 0, agg = 0, spine = 0;
  if (tiers === 1) {
    leaf = ceil(N / k);
  } else if (tiers === 2) {
    leaf = ceil(N / (k / 2));
    spine = ceil(N / k);
  } else {
    leaf = ceil(N / (k / 2));
    agg = ceil(N / (k / 2));
    spine = ceil(N / k); // core / super-spine
  }
  const perPlane = { leaf, agg, spine, total: leaf + agg + spine };
  const switchesTotal = perPlane.total * P;
  // transceiver ends in 800G-equivalents: host link + one link layer per tier above leaf, 2 ends each
  const gpuGbps = P * fo.plane_gbps;
  const layers = tiers; // host->leaf, leaf->spine, spine->core
  const optics800 = ceil((2 * layers * N * gpuGbps) / 800);
  return {
    tiers,
    planes: P,
    per_plane: perPlane,
    switches: switchesTotal,
    switch_kw: r1(switchesTotal * sw.kw_with_optics),
    transceiver_ends_800g_eq: optics800,
  };
}

/** Pick the cheapest non-blocking topology for N GPUs and list the alternatives. */
function topologyFor(N, fo, platform, sw) {
  const lim = fabricLimits(fo, platform, sw);
  if (lim.vendor_defined) {
    return { chosen: { tiers: null, vendor_defined: true, note: fo.tech }, alternatives: [], limits: lim };
  }
  if (N <= lim.max_gpus_1tier) {
    return { chosen: fabricBill(N, fo, sw, 1), alternatives: [], limits: lim };
  }
  if (N <= lim.max_gpus_2tier) {
    return { chosen: fabricBill(N, fo, sw, 2), alternatives: [], limits: lim };
  }
  // Beyond 2-tier: (A) several independent 2-tier pods, (B) one 3-tier fabric
  const pods = ceil(N / lim.max_gpus_2tier);
  const perPod = fabricBill(ceil(N / pods), fo, sw, 2);
  const podsBill = {
    option: "A",
    label: `${pods} independent 2-tier pods`,
    tiers: 2,
    pods,
    switches: perPod.switches * pods,
    switch_kw: r1(perPod.switch_kw * pods),
    transceiver_ends_800g_eq: perPod.transceiver_ends_800g_eq * pods,
    tradeoff: "Cheapest. A single job cannot span pods at full bandwidth — good for multi-tenant / many jobs, not one giant training run.",
  };
  const three = fabricBill(N, fo, sw, 3);
  const threeBill = {
    option: "B",
    label: "Single 3-tier fat tree",
    ...three,
    tradeoff: "One flat fabric for one job. ~+67% switches and ~+50% optics per GPU vs 2-tier, +1 hop latency.",
  };
  return {
    chosen: null,
    beyond_2tier: true,
    alternatives: [podsBill, threeBill],
    limits: lim,
  };
}

/**
 * Full plan for a sales conversation.
 * input: { platform, fabric, units?, gpus?, rackOption?, workload, storage, frontend, powerProfile? }
 *   units = systems (nodes) for node platforms, racks for rack-scale platforms
 */
function planCluster(input, DATA) {
  const p = byId(DATA.platforms, input.platform);
  const fo = byId(DATA.fabric_options, input.fabric);
  if (fo.platform !== p.id) throw new Error(`${fo.id} is not a fabric for ${p.id}`);
  const sw = fo.switch ? byId(DATA.switches, fo.switch) : null;
  const rackOpt = input.rackOption ? byId(p.rack_options, input.rackOption) : defaultRackOption(p);
  const workload = input.workload || "mixed";

  const systems = input.units ?? ceil((input.gpus || 0) / p.accel_per_system);
  const gpus = systems * p.accel_per_system;
  const racks = ceil(systems / rackOpt.systems_per_rack);

  // ---- power ----
  let sysKw = p.system_kw_typ;
  if (input.powerProfile && p.power_profiles) sysKw = byId(p.power_profiles, input.powerProfile).rack_kw;
  const computeKwTyp = r1(systems * sysKw);
  const computeKwPeak = r1(systems * (input.powerProfile ? sysKw : p.system_kw_peak));
  const share = DATA.assumptions.compute_share_of_it_power;
  let itKw = r1(computeKwTyp / share);
  if (p.cluster_provisioned_kw_per_system) itKw = r1(Math.max(itKw, systems * p.cluster_provisioned_kw_per_system));
  const liquid = /liquid|water/i.test(rackOpt.cooling); // cooling of the chosen rack density, not the platform's options
  const pue = liquid ? DATA.assumptions.pue.liquid : DATA.assumptions.pue.air;

  // ---- network ----
  const topo = topologyFor(gpus, fo, p, sw);
  const netChosen = topo.chosen || topo.alternatives.find((a) => a.option === "B");

  // ---- storage: performance tier (chosen vendor) + capacity tier (object) ----
  const SR = DATA.storage_rules;
  const st = input.storage ? byId(DATA.storage, input.storage) : null;
  const tier = SR.tier_by_workload[workload];
  const readGBs = r1(gpus * SR.read_gbps_per_gpu[tier]);
  const r3 = (x) => Math.round(x * 1000) / 1000;
  const lakePB = r3((gpus * SR.usable_tb_per_gpu[workload]) / 1000);
  const hotPB = r3((gpus * SR.hot_tb_per_gpu[workload]) / 1000);
  let storagePlan = { tier, read_GBps: readGBs, write_GBps: r1(readGBs * SR.write_ratio), hot_PB: hotPB, lake_PB: lakePB, usable_PB: lakePB };
  if (st) {
    const unitsPerf = ceil(readGBs / st.read_gbps_per_unit);
    const unitsCap = ceil(hotPB / st.usable_pb_per_unit);
    const units = Math.max(unitsPerf, unitsCap, 1);
    const cap = byId(DATA.storage, SR.capacity_tier_id);
    const coldPB = Math.max(0, lakePB - units * st.usable_pb_per_unit);
    const capUnits = st.id === cap.id ? 0 : ceil(coldPB / cap.usable_pb_per_unit);
    storagePlan = {
      ...storagePlan,
      vendor: st.vendor,
      product: st.product,
      building_blocks: units,
      sized_by: unitsPerf >= unitsCap ? "performance" : "capacity",
      performance_tier_kw: r1(units * st.kw_per_unit),
      capacity_tier_units: capUnits,
      capacity_tier_kw: r1(capUnits * cap.kw_per_unit),
      kw: r1(units * st.kw_per_unit + capUnits * cap.kw_per_unit),
    };
  }

  // ---- front-end CPU ----
  const fe = input.frontend ? byId(DATA.frontend, input.frontend) : null;
  const vcpu = gpus * DATA.frontend_rules.vcpu_per_gpu[workload];
  let fePlan = { vcpu_required: vcpu };
  if (fe) {
    const nodes = ceil(vcpu / fe.vcpu_per_node) + DATA.frontend_rules.control_plane_nodes;
    fePlan = { ...fePlan, cpu: fe.name, nodes, kw: r1(nodes * fe.node_kw) };
  }

  // ---- 90/10 power check ----
  const bottomUp = r1((netChosen?.switch_kw || 0) + (storagePlan.kw || 0) + (fePlan.kw || 0));
  const allowance = r1(itKw - computeKwTyp);

  return {
    platform: p.name,
    fabric: `${fo.fabric} — ${fo.tech}`,
    rack_option: rackOpt.id,
    systems,
    gpus,
    compute_racks: racks,
    rack_kw_typ: r1(rackOpt.systems_per_rack * sysKw),
    power: {
      compute_kw_typ: computeKwTyp,
      compute_kw_peak: computeKwPeak,
      network_and_peripherals_allowance_kw: allowance,
      bottom_up_net_storage_frontend_kw: bottomUp,
      allowance_exceeded: bottomUp > allowance,
      it_kw: itKw,
      pue,
      facility_kw: r1(itKw * pue),
      facility_mw: Math.round((itKw * pue) / 10) / 100,
    },
    network: topo,
    storage: storagePlan,
    frontend: fePlan,
    confidence: p.confidence,
  };
}

// Links each displayed field to an explainer, and fills the explainer's
// {placeholders} from the data row. Pure functions, no dependencies.
//
//   import { explainLinks, renderExplainer } from "./explain.mjs";
//   const links = explainLinks("fabric_option", row, DATA);    // { max_racks_2tier: "ceiling-2tier", ... }
//   const box   = renderExplainer(links.max_racks_2tier, "fabric_option", row, DATA);
//   // box = { id, title, summary, body (Markdown), links: [{label,url}] }



const n = (x) => (typeof x === "number" ? x.toLocaleString("en-US") : x);
const gbpsLabel = (g) => (g >= 1000 ? `${(g / 1000).toLocaleString("en-US")} Tb/s` : `${g} Gb/s`);
const plural = (w, c) => (c === 1 ? w : `${w}s`);
const WORDS = { 1: "one", 2: "two", 3: "three", 4: "four", 6: "six", 8: "eight", 12: "twelve" };
const word = (x) => WORDS[x] ?? String(x);
const times = (x) => (x === 2 ? "twice" : `${word(x)} times`);

// ------------------------------------------------------------------ contexts
function globalContext(DATA) {
  const SR = DATA.storage_rules, FR = DATA.frontend_rules;
  const turin = byId(DATA.frontend, "epyc-turin");
  const exVcpu = 1000 * FR.vcpu_per_gpu.inference;
  return {
    hot_training: SR.hot_tb_per_gpu.training,
    hot_inference: SR.hot_tb_per_gpu.inference,
    lake_training: SR.usable_tb_per_gpu.training,
    lake_inference: SR.usable_tb_per_gpu.inference,
    read_enhanced: SR.read_gbps_per_gpu.enhanced,
    read_standard: SR.read_gbps_per_gpu.standard,
    example_read_tbs: n((10000 * SR.read_gbps_per_gpu.enhanced) / 1000),
    control_plane_nodes: FR.control_plane_nodes,
    vcpu_inference: FR.vcpu_per_gpu.inference,
    vcpu_mixed: FR.vcpu_per_gpu.mixed,
    vcpu_fine_tuning: FR.vcpu_per_gpu.fine_tuning,
    vcpu_training: FR.vcpu_per_gpu.training,
    example_vcpu: n(exVcpu),
    example_nodes: Math.ceil(exVcpu / turin.vcpu_per_node),
    turin_vcpu: turin.vcpu_per_node,
  };
}

function platformContext(p, DATA) {
  const ro = defaultRackOption(p);
  const isWafer = p.vendor === "Cerebras";
  const accel = isWafer ? "wafer" : "GPU";
  const accelPerRack = p.accel_per_system * ro.systems_per_rack;
  const rackTyp = Math.round(ro.systems_per_rack * p.system_kw_typ);
  const rackPeak = Math.round(ro.systems_per_rack * (p.system_kw_peak ?? p.system_kw_typ));
  const liquid = /liquid|water/i.test(p.cooling) && !/^air/i.test(p.cooling);
  const memTB = (accelPerRack * (p.hbm_gb_per_accel || 0)) / 1000;
  const sysWord = p.form === "rack" ? "rack" : isWafer ? "system" : "server";
  return {
    ...globalContext(DATA),
    platform: p.name,
    vendor: p.vendor,
    accel_label: accel,
    accel_plural: plural(accel, p.accel_per_system),
    accel_per_system: p.accel_per_system,
    accel_per_rack: accelPerRack,
    system_word: sysWord,
    scale_up_tech: p.scale_up.tech,
    scale_up_domain: p.scale_up.domain,
    gbps_per_gpu_label: gbpsLabel(p.scale_out_gbps_per_accel),
    hbm_label: isWafer ? `${p.hbm_gb_per_accel} GB of on-wafer SRAM` : `${p.hbm_gb_per_accel} GB`,
    rack_memory_label: `${memTB.toLocaleString("en-US", { maximumFractionDigits: 1 })} TB`,
    rack_memory_sentence: p.form === "rack" ? `, or ${memTB.toLocaleString("en-US", { maximumFractionDigits: 1 })} TB across the rack` : "",
    form_phrase: p.form === "rack"
      ? `as a whole rack of ${p.accel_per_system} ${plural(accel, p.accel_per_system)} working as one`
      : `as ${p.accel_per_system}-GPU servers`,
    density_label: p.form === "rack" ? "one system per rack" : `${ro.systems_per_rack} ${plural(sysWord, ro.systems_per_rack)} per rack`,
    rack_kw_typ: rackTyp,
    rack_kw_peak: rackPeak,
    peak_phrase: rackPeak > rackTyp ? `, peaking near ${rackPeak} kW` : "",
    cooling: p.cooling,
    cooling_word: liquid ? "liquid-cooled" : "air-cooled",
    cooling_sentence: liquid
      ? "It needs direct liquid cooling."
      : rackTyp > 40 ? "It can be air-cooled at this density, with rear-door heat exchangers." : "It can be air-cooled at this density.",
    density_note: p.form === "rack"
      ? "A rack-scale system cannot be split, so the hall must support the full rack."
      : "Fewer servers per rack is possible, but needs more racks and floor space.",
    availability: p.availability,
    confidence: p.confidence,
    su_label: p.form === "rack"
      ? `${p.su_systems} racks (${n(p.su_systems * p.accel_per_system)} ${plural(accel, 2)})`
      : `${p.su_systems} ${plural(sysWord, p.su_systems)} (${n(p.su_systems * p.accel_per_system)} ${plural(accel, 2)})`,
    vendor_max_label: p.max_cluster_systems ? `${n(p.max_cluster_systems)} systems` : "a size Cerebras has not yet published",
  };
}

function fabricContext(fo, DATA) {
  const p = byId(DATA.platforms, fo.platform);
  const ctx = platformContext(p, DATA);
  const sw = fo.switch ? byId(DATA.switches, fo.switch) : null;
  const L = fo.limits || fabricLimits(fo, p, sw);
  const ro = defaultRackOption(p);
  if (!sw) return { ...ctx, fabric: fo.fabric, switch: "Cerebras-supplied network", planes: fo.planes };
  const k = L.k, half = k / 2;
  const unitsLabel = p.form === "rack"
    ? `${n(L.max_racks_2tier)} racks`
    : `${n(L.max_systems_2tier)} servers, ${n(L.max_racks_2tier)} racks`;
  const unitsSentence = p.form === "rack"
    ? `With ${p.accel_per_system} GPUs per rack, that is **${n(L.max_racks_2tier)} racks**.`
    : `With ${p.accel_per_system} GPUs per server, that is **${n(L.max_systems_2tier)} servers** (${n(L.max_racks_2tier)} racks at ${ro.systems_per_rack} servers per rack).`;
  const kAlt = sw.radix[800] ?? k;
  const altCeil = (kAlt * kAlt) / 2;
  const k200 = sw.radix[200] ?? null;
  const nvidiaSx = /Spectrum-X/.test(fo.fabric);
  return {
    ...ctx,
    fabric: fo.fabric,
    switch: sw.name,
    k, half_k: half,
    planes: fo.planes,
    planes_word: word(fo.planes),
    planes_times: times(fo.planes),
    plane_gbps_label: gbpsLabel(fo.plane_gbps),
    gbps_per_gpu_label: gbpsLabel(fo.planes * fo.plane_gbps),
    max_gpus_2tier: n(L.max_gpus_2tier),
    max_racks_2tier: n(L.max_racks_2tier),
    max_systems_2tier: n(L.max_systems_2tier),
    max_units_label: unitsLabel,
    units_sentence: unitsSentence,
    plane_note: fo.planes > 1
      ? ` Each GPU connects to ${word(fo.planes)} of these networks in parallel (one port in each), so the GPU limit equals one network's limit.`
      : "",
    leaf_fit: p.form === "rack" && ctx.accel_per_rack === half
      ? (fo.planes > 1 ? " That works out neatly as one leaf switch per rack in each plane." : " That works out neatly as one leaf switch per rack.")
      : "",
    k_alt: kAlt,
    alt_ceiling: n(altCeil),
    multiplier: kAlt !== k ? `${Math.round(L.max_gpus_2tier / altCeil)}x` : "",
    balance_note: nvidiaSx
      ? "The network cards must spread traffic evenly across the planes; NVIDIA Spectrum-X does this in hardware."
      : "The network cards and software must spread traffic evenly across the planes; confirm the vendor supports this before proposing it.",
    k_200: k200 ?? "",
    ceil_200: k200 ? n((k200 * k200) / 2) : "",
  };
}

function referenceContext(r, DATA) {
  const fo = byId(DATA.fabric_options, r.fabric_option_id);
  const p = byId(DATA.platforms, r.platform_id);
  const ctx = fabricContext(fo, DATA);
  const mw = (kw) => (kw / 1000).toLocaleString("en-US", { maximumFractionDigits: 1 });
  const vendorPower = !!p.cluster_provisioned_kw_per_system;
  return {
    ...ctx,
    gpus: n(r.gpus),
    compute_racks: n(r.compute_racks),
    pue: r.pue,
    cooling_word: r.pue <= DATA.assumptions.pue.liquid ? "liquid-cooled" : "air-cooled",
    compute_mw: mw(r.compute_kw_typ),
    it_mw: mw(r.it_kw),
    facility_mw: mw(r.facility_kw),
    ref_example: vendorPower
      ? `For Cerebras, Atlas instead uses Cerebras's own provisioned load, which already includes the network cabinets: ${mw(r.it_kw)} MW of IT power here.`
      : `For this configuration: ${mw(r.compute_kw_typ)} MW of compute ÷ 0.9 = **${mw(r.it_kw)} MW** of IT power.`,
    pue_example: `Here: ${mw(r.it_kw)} MW × ${r.pue} = **${mw(r.facility_kw)} MW** of facility power.`,
  };
}

function storageContext(s, DATA) { return { ...globalContext(DATA), product: s.product, vendor: s.vendor }; }
function frontendContext(f, DATA) { return { ...globalContext(DATA), cpu: f.name }; }

function contextFor(entity, row, DATA) {
  switch (entity) {
    case "platform": return platformContext(row, DATA);
    case "fabric_option": return fabricContext(row, DATA);
    case "reference_config": return referenceContext(row, DATA);
    case "storage_option": return storageContext(row, DATA);
    case "frontend_option": return frontendContext(row, DATA);
    default: throw new Error(`Unknown entity ${entity}`);
  }
}

// ------------------------------------------------------------------ which "why?" link sits on which field
function explainLinks(entity, row, DATA) {
  const out = {};
  if (entity === "platform") {
    const p = row, wafer = p.vendor === "Cerebras";
    out.form = wafer ? "cerebras-wafer" : "rack-scale-vs-server";
    if (/NVL72/.test(p.name)) out.family = "what-is-nvl72";
    if (/Helios/.test(p.name)) out.family = "what-is-helios";
    if (!wafer) { out.scale_up = "scale-up-vs-scale-out"; out.hbm_gb_per_accel = "hbm-memory"; }
    out.rack_kw_typ = "rack-power-density";
    out.cooling = "liquid-vs-air";
    if ((p.system_kw_peak ?? p.system_kw_typ) > p.system_kw_typ) out.system_kw_peak = "typical-vs-peak";
    if (!p.workloads.hpc && !wafer) out.wl_hpc = "fp64-hpc";
    out.status = "status-and-confidence";
  } else if (entity === "fabric_option") {
    const fo = row;
    if (!fo.switch) { out.fabric = "cerebras-fabric"; out.max_gpus_2tier = "cerebras-fabric"; return out; }
    const sw = byId(DATA.switches, fo.switch);
    out.fabric = /InfiniBand/.test(fo.fabric) ? "fabric-infiniband" : /Spectrum-X/.test(fo.fabric) ? "fabric-spectrum-x" : "fabric-open-ethernet";
    out.max_gpus_2tier = "ceiling-2tier";
    out.max_racks_2tier = "ceiling-2tier";
    out.max_systems_2tier = "ceiling-2tier";
    if (fo.planes > 1 && fo.plane_gbps < 800) out.planes = "multiplane";
    else if (fo.planes > 1 && byId(DATA.platforms, fo.platform).family === "Vera Rubin") out.planes = "rubin-two-planes";
    if (fo.planes === 1 && fo.plane_gbps === 800 && sw.radix[800] <= 64) out.warning = "single-plane-trap";
    out.non_blocking = "non-blocking";
    out.beyond_2tier = "beyond-2tier";
  } else if (entity === "reference_config") {
    const r = row;
    const fo = byId(DATA.fabric_options, r.fabric_option_id);
    if (!fo.switch) out.scale_point = "cerebras-fabric";
    else if (r.scale_point === "su") out.scale_point = "scalable-unit";
    else if (r.scale_point === "max_2tier") out.scale_point = "ceiling-2tier";
    else if (/_A$/.test(r.scale_point)) out.scale_point = "beyond-2tier";
    else if (/_B$/.test(r.scale_point)) out.scale_point = "three-tier-cost";
    if (fo.switch) { out.topology = "non-blocking"; out.transceiver_ends_800g_eq = "optics-count"; }
    out.rack_kw_typ = "rack-power-density";
    out.it_kw = "power-90-10";
    out.facility_kw = "pue";
    out.storage_read_GBps = "storage-bandwidth";
    out.storage_usable_PB = "storage-two-tiers";
    out.frontend_vcpu = "vcpu-per-gpu";
  } else if (entity === "storage_option") {
    out.product = "storage-vendors";
    out.role = "storage-two-tiers";
    out.read_gbps_per_unit = "storage-bandwidth";
    out.protocols = "gpudirect-storage";
  } else if (entity === "frontend_option") {
    out.name = "frontend-cpu";
    out.vcpu_per_node = "vcpu-per-gpu";
  }
  return out;
}

// ------------------------------------------------------------------ render
function fill(template, ctx) {
  return template.replace(/\{(\w+)\}/g, (m, key) => {
    if (!(key in ctx) || ctx[key] === undefined || ctx[key] === null) throw new Error(`Missing placeholder {${key}}`);
    return String(ctx[key]);
  });
}

function renderExplainer(id, entity, row, DATA) {
  const e = byId(DATA.explainers, id);
  const ctx = contextFor(entity, row, DATA);
  return { id, title: fill(e.title, ctx), summary: fill(e.summary, ctx), body: fill(e.body, ctx), links: e.links };
}

// ------------------------------------------------------------------ live configurations
/** Turn a planCluster() result into a reference_config-shaped row, so its "why?" boxes can be rendered live. */
function rowFromPlan(input, plan, DATA) {
  const p = byId(DATA.platforms, input.platform);
  const t = plan.network;
  const tiers = t.chosen?.tiers ?? null;
  return {
    id: "live",
    platform_id: p.id,
    fabric_option_id: input.fabric,
    scale_point: t.beyond_2tier ? "beyond_2tier_B" : "live",
    gpus: plan.gpus,
    compute_racks: plan.compute_racks,
    rack_kw_typ: plan.rack_kw_typ,
    tiers,
    pue: plan.power.pue,
    compute_kw_typ: plan.power.compute_kw_typ,
    it_kw: plan.power.it_kw,
    facility_kw: plan.power.facility_kw,
  };
}

</script>
<script>
// Atlas reference explorer — UI. Uses DATA and the engine functions inlined above.
(() => {
  const $ = (id) => document.getElementById(id);
  const fmt = (x, d = 0) => Number(x).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
  const mw = (kw) => fmt(kw / 1000, kw >= 10000 ? 1 : 2);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const WL = { training: "Training", inference: "Inference", fine_tuning: "Fine-tuning", hpc: "HPC (FP64 simulation)", digital_twin: "Digital twin", mixed: "Mixed" };
  const STATUS = { shipping: ["Shipping", "ship"], ramping: ["Ramping", "ramp"], announced: ["Announced", "ann"] };

  const state = {
    vendor: "All",
    workload: "training",
    platform: "nv-gb300-nvl72",
    gpus: 10368,
    density: null,
    profile: null,
    storage: "vast",
    frontend: "epyc-turin",
    showAll: false,
  };

  // ---------------- tiny Markdown renderer for explanation bodies ----------------
  function inline(s) {
    return esc(s)
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, "$1<em>$2</em>");
  }
  function md(src) {
    return src.trim().split(/\n\s*\n/).map((block) => {
      const lines = block.split("\n");
      if (lines.every((l) => /^- /.test(l))) return "<ul>" + lines.map((l) => `<li>${inline(l.slice(2))}</li>`).join("") + "</ul>";
      if (lines.every((l) => /^\d+\. /.test(l))) return "<ol>" + lines.map((l) => `<li>${inline(l.replace(/^\d+\. /, ""))}</li>`).join("") + "</ol>";
      if (lines.every((l) => /^\|/.test(l))) {
        const rows = lines.filter((l) => !/^\|\s*-/.test(l)).map((l) => l.replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
        const [h, ...b] = rows;
        return `<table><thead><tr>${h.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${b.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
      }
      return `<p>${inline(lines.join(" "))}</p>`;
    }).join("");
  }

  // ---------------- "why?" overlay ----------------
  // Each why-button carries data-x = index into WHY (the explainer id + entity + row to render it for).
  let WHY = [];
  function why(id, entity, row, label = "why?") {
    if (!id) return "";
    WHY.push({ id, entity, row });
    return `<button type="button" class="why" data-x="${WHY.length - 1}" aria-haspopup="dialog">${esc(label)}</button>`;
  }
  function openWhy(i) {
    const w = WHY[i];
    const box = renderExplainer(w.id, w.entity, w.row, DATA);
    $("why-title").textContent = box.title;
    $("why-lead").textContent = box.summary;
    $("why-body").innerHTML = md(box.body);
    $("why-eng").innerHTML = box.links.length
      ? `<h3>For engineers</h3><ul>${box.links.map((l) => `<li><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></li>`).join("")}</ul>`
      : "";
    $("why").showModal();
    $("why").querySelector(".dlg").scrollTop = 0;
  }
  document.addEventListener("click", (e) => {
    const b = e.target.closest(".why");
    if (b) openWhy(+b.dataset.x);
  });
  $("why-close").addEventListener("click", () => $("why").close());
  $("why").addEventListener("click", (e) => { if (e.target === $("why")) $("why").close(); });

  // ---------------- helpers on the data ----------------
  const P = () => byId(DATA.platforms, state.platform);
  const unitWord = (p) => (p.vendor === "Cerebras" ? "wafers" : "GPUs");
  const eligible = (p) => !!p.workloads[state.workload];
  const visible = (p) => state.vendor === "All" || p.vendor === state.vendor;
  const rackOpt = (p) => (state.density ? p.rack_options.find((o) => o.id === state.density) : null) || defaultRackOption(p);

  // ---------------- inputs ----------------
  function buildStatic() {
    $("asof").textContent = `Reference data as of ${DATA.assumptions.data_as_of} · presales ballpark, validate before quoting`;
    $("vendor").innerHTML = ["All", "NVIDIA", "AMD", "Cerebras"].map((v) => `<button type="button" data-v="${v}" aria-pressed="${v === state.vendor}">${v}</button>`).join("");
    $("vendor").addEventListener("click", (e) => {
      const b = e.target.closest("button"); if (!b) return;
      state.vendor = b.dataset.v;
      [...$("vendor").children].forEach((x) => x.setAttribute("aria-pressed", x === b));
      const cur = P();
      if (!visible(cur) || !eligible(cur)) pickFirstPlatform();
      render();
    });
    $("workload").innerHTML = DATA.workloads.map((w) => `<option value="${w}">${WL[w]}</option>`).join("");
    $("workload").value = state.workload;
    $("workload").addEventListener("change", (e) => { state.workload = e.target.value; if (!eligible(P())) pickFirstPlatform(); render(); });
    $("storage").innerHTML = DATA.storage.filter((s) => s.role === "performance").map((s) => `<option value="${s.id}">${esc(s.vendor)} — ${esc(s.product.split(" — ")[0].split(" (")[0])}</option>`).join("");
    $("storage").value = state.storage;
    $("storage").addEventListener("change", (e) => { state.storage = e.target.value; render(); });
    $("frontend").innerHTML = DATA.frontend.map((f) => `<option value="${f.id}">${esc(f.name)}</option>`).join("");
    $("frontend").value = state.frontend;
    $("frontend").addEventListener("change", (e) => { state.frontend = e.target.value; render(); });
    $("size").addEventListener("change", (e) => { const v = Math.max(1, Math.round(+e.target.value || 1)); state.gpus = v; render(); });
    $("presets").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; state.gpus = +b.dataset.g; render(); });
    $("density").addEventListener("change", (e) => { state.density = e.target.value; render(); });
    $("profile").addEventListener("change", (e) => { state.profile = e.target.value || null; render(); });
    $("platforms").addEventListener("click", (e) => {
      const b = e.target.closest(".pcard"); if (!b || b.disabled) return;
      selectPlatform(b.dataset.id);
    });
    $("platforms").addEventListener("keydown", (e) => {
      if (!["ArrowDown", "ArrowUp"].includes(e.key)) return;
      const cards = [...$("platforms").querySelectorAll(".pcard:not([disabled])")];
      const i = cards.findIndex((c) => c.dataset.id === state.platform);
      const n = cards.at((i + (e.key === "ArrowDown" ? 1 : -1) + cards.length) % cards.length);
      if (n) { e.preventDefault(); selectPlatform(n.dataset.id); $("platforms").querySelector(`[data-id="${n.dataset.id}"]`).focus(); }
    });
  }
  function selectPlatform(id) {
    const before = P();
