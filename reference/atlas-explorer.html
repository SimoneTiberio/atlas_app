    state.platform = id;
    state.density = null; state.profile = null;
    const p = P();
    // keep the cluster size meaningful when switching between GPU and wafer platforms
    if ((before.vendor === "Cerebras") !== (p.vendor === "Cerebras")) state.gpus = p.su_systems * p.accel_per_system;
    render();
  }
  function pickFirstPlatform() {
    const p = DATA.platforms.find((x) => visible(x) && eligible(x)) || DATA.platforms.find(visible);
    if (p) selectPlatform(p.id);
  }

  function renderInputs() {
    const p = P();
    // platform list grouped by vendor
    let html = "", last = "";
    for (const x of DATA.platforms.filter(visible)) {
      if (x.vendor !== last) { html += `<div class="vendor-head">${esc(x.vendor)}</div>`; last = x.vendor; }
      const [st, cls] = STATUS[x.status];
      const ok = eligible(x);
      const ro = defaultRackOption(x);
      const rackKw = Math.round(ro.systems_per_rack * x.system_kw_typ);
      const meta = ok
        ? `${x.accel_per_system} ${x.vendor === "Cerebras" ? (x.accel_per_system > 1 ? "wafers" : "wafer") : "GPUs"} per ${x.form === "rack" ? "rack" : "system"} · ~${rackKw} kW per rack`
        : `Not suited to ${WL[state.workload].toLowerCase()}`;
      html += `<button type="button" role="radio" class="pcard" data-id="${x.id}" aria-checked="${x.id === p.id}" tabindex="${x.id === p.id ? 0 : -1}" ${ok ? "" : "disabled"}>
        <span class="pname">${esc(x.name)}</span>
        <span>${x.confidence === "estimate" ? '<span class="tag est">estimate</span> ' : ""}<span class="tag ${cls}">${st}</span></span>
        <span class="pmeta">${esc(meta)}</span></button>`;
    }
    $("platforms").innerHTML = html;

    // size
    $("size-l").textContent = `Cluster size (${unitWord(p)})`;
    $("size").value = state.gpus;
    $("size").step = p.accel_per_system;
    const su = p.su_systems * p.accel_per_system;
    const presets = p.vendor === "Cerebras"
      ? [[su, "1 scalable unit"], [32 * p.accel_per_system, `${32 * p.accel_per_system}`], [128 * p.accel_per_system, `${fmt(128 * p.accel_per_system)}`]]
      : [[su, "1 scalable unit"], [1024, "~1,000"], [10368, "~10,000"], [32768, "~32,000"], [131072, "~131,000"]];
    $("presets").innerHTML = presets.map(([g, l]) => `<button type="button" data-g="${g}">${l}</button>`).join("");
    const systems = Math.ceil(state.gpus / p.accel_per_system);
    const ro = rackOpt(p);
    const racks = Math.ceil(systems / ro.systems_per_rack);
    $("size-hint").textContent = p.form === "rack"
      ? `${fmt(racks)} ${racks === 1 ? "rack" : "racks"} of ${p.accel_per_system} (${fmt(systems * p.accel_per_system)} ${unitWord(p)})`
      : `${fmt(systems)} ${p.vendor === "Cerebras" ? "systems" : "servers"} in ${fmt(racks)} racks`;

    // density
    $("density-f").hidden = p.rack_options.length < 2;
    $("density").innerHTML = p.rack_options.map((o) => `<option value="${o.id}">${o.systems_per_rack} per rack — ${esc(o.cooling)} (~${Math.round(o.systems_per_rack * p.system_kw_typ)} kW)</option>`).join("");
    $("density").value = ro.id;
    // power profile
    $("profile-f").hidden = !p.power_profiles;
    if (p.power_profiles) {
      $("profile").innerHTML = `<option value="">Typical (${p.system_kw_typ} kW)</option>` + p.power_profiles.map((x) => `<option value="${x.id}">${esc(x.id === "max-q" ? "Max-Q" : "Max-P")} — ${x.rack_kw} kW, ${esc(x.note.toLowerCase())}</option>`).join("");
      $("profile").value = state.profile || "";
    }
  }

  // ---------------- results ----------------
  function gauge(req, ceil, unit, ceilingWhy, limitName = "Two-layer limit") {
    // horizontal track: 0 → max(req, ceil) × 1.15, filled to req, marker at ceil
    const W = 1000, H = 56, top = 14, bh = 14;
    const span = Math.max(req, ceil) * 1.15;
    const x = (v) => (v / span) * W;
    const over = req > ceil;
    const reqW = Math.max(2, x(Math.min(req, ceil)));
    const overW = over ? x(req) - x(ceil) : 0;
    const label = `${fmt(req)} ${unit} requested, ${limitName.toLowerCase()} ${fmt(ceil)}`;
    return `<div class="gauge"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">
      <rect x="0" y="${top}" width="${W}" height="${bh}" rx="7" fill="#E3E9ED"/>
      <rect x="0" y="${top}" width="${reqW}" height="${bh}" rx="7" fill="var(--coolant)"/>
      ${over ? `<rect x="${x(ceil)}" y="${top}" width="${overW}" height="${bh}" rx="0" fill="var(--over)"/>` : ""}
      <line x1="${x(ceil)}" x2="${x(ceil)}" y1="4" y2="${top + bh + 10}" stroke="var(--ink)" stroke-width="2" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="cap num"><span>${fmt(req)} ${unit} requested</span><span>${limitName}: <strong>${fmt(ceil)} ${unit}</strong>${ceilingWhy}</span></div></div>`;
  }

  function render() {
    WHY = [];
    renderInputs();
    const p = P();
    const ro = rackOpt(p);
    const out = $("results");
    if (!DATA.platforms.some((x) => visible(x) && eligible(x))) {
      out.innerHTML = `<div class="empty"><h2>No platform in this reference fits ${esc(WL[state.workload].toLowerCase())}</h2>
        <p>Digital twins (NVIDIA Omniverse) run on RTX-class servers, which are not in this dataset yet. Pick another workload to see AI factory options.</p></div>`;
      return;
    }
    const base = { platform: p.id, gpus: state.gpus, rackOption: ro.id, workload: state.workload, storage: state.storage, frontend: state.frontend, powerProfile: state.profile || undefined };
    const fabrics = DATA.fabric_options.filter((f) => f.platform === p.id);
    const runs = fabrics.map((f) => {
      const input = { ...base, fabric: f.id };
      const plan = planCluster(input, DATA);
      const row = rowFromPlan(input, plan, DATA);
      return { f, plan, row, fits: !!plan.network.chosen };
    });
    runs.sort((a, b) => (b.fits - a.fits) || (b.f.recommended - a.f.recommended) ||
      ((a.plan.network.chosen?.switch_kw ?? 1e12) - (b.plan.network.chosen?.switch_kw ?? 1e12)) ||
      (b.f.limits.max_gpus_2tier ?? 0) - (a.f.limits.max_gpus_2tier ?? 0));
    const first = runs[0];
    const plan = first.plan, liveRow = first.row;
    const pLinks = explainLinks("platform", p, DATA);
    const u = unitWord(p);

    // ---- headline: what the customer gets, independent of the network choice
    const cooling = /liquid|water/i.test(ro.cooling) ? "Liquid-cooled" : "Air-cooled";
    const st = DATA.storage.find((s) => s.id === state.storage);
    const rackPeak = Math.round(ro.systems_per_rack * (state.profile ? plan.rack_kw_typ / ro.systems_per_rack : p.system_kw_peak));
    let html = `<div class="headline">
      <h2>${esc(p.name)} · ${fmt(plan.gpus)} ${u}</h2>
      <p class="sub">${esc(WL[state.workload])} · ${esc(p.availability)}${pLinks.family ? why(pLinks.family, "platform", p, "what is it?") : why(pLinks.form, "platform", p, "what is it?")}${p.confidence === "estimate" ? ' · <span class="tag est">power figures estimated</span>' + why("status-and-confidence", "platform", p) : ""}</p>
      <div class="facts">
        <div class="fact"><div class="k">Compute racks</div><div class="v num">${fmt(plan.compute_racks)}</div>
          <div class="d">${p.form === "rack" ? "one system per rack" : `${ro.systems_per_rack} ${p.vendor === "Cerebras" ? "systems" : "servers"} per rack`}</div></div>
        <div class="fact"><div class="k">Per rack</div><div class="v num">${fmt(plan.rack_kw_typ)}<small>kW</small></div>
          <div class="d">${cooling}${why(pLinks.rack_kw_typ, "platform", p)}${why(pLinks.cooling, "platform", p, "cooling")}${rackPeak > plan.rack_kw_typ ? `<br>peak ~${fmt(rackPeak)} kW` + why("typical-vs-peak", "platform", p) : ""}</div></div>
        <div class="fact"><div class="k">IT power</div><div class="v num">${mw(plan.power.it_kw)}<small>MW</small></div>
          <div class="d">${p.cluster_provisioned_kw_per_system ? "vendor-provisioned load" : "compute ÷ 0.9"}${why("power-90-10", "reference_config", liveRow)}</div></div>
        <div class="fact"><div class="k">Facility power</div><div class="v num">${mw(plan.power.facility_kw)}<small>MW</small></div>
          <div class="d">PUE ${plan.power.pue}${why("pue", "reference_config", liveRow)}</div></div>
        <div class="fact"><div class="k">Storage read</div><div class="v num">${plan.storage.read_GBps < 1000 ? `${fmt(plan.storage.read_GBps, 1)}<small>GB/s</small>` : `${fmt(plan.storage.read_GBps / 1000, 1)}<small>TB/s</small>`}</div>
          <div class="d">${esc(plan.storage.tier)} tier${why("storage-bandwidth", "reference_config", liveRow)}</div></div>
        <div class="fact"><div class="k">Data</div><div class="v num">${plan.storage.lake_PB < 1 ? `${fmt(plan.storage.lake_PB * 1000)}<small>TB</small>` : `${fmt(plan.storage.lake_PB, plan.storage.lake_PB < 10 ? 1 : 0)}<small>PB</small>`}</div>
          <div class="d">${fmt(plan.storage.building_blocks)} ${esc(st.vendor)} ${plan.storage.building_blocks === 1 ? "block" : "blocks"}${plan.storage.capacity_tier_units ? ` + ${fmt(plan.storage.capacity_tier_units)} object ${plan.storage.capacity_tier_units === 1 ? "rack" : "racks"}` : ""}${why("storage-two-tiers", "reference_config", liveRow)}</div></div>
        <div class="fact"><div class="k">Front-end CPU</div><div class="v num">${fmt(plan.frontend.nodes)}<small>servers</small></div>
          <div class="d">${fmt(plan.frontend.vcpu_required)} vCPU${why("vcpu-per-gpu", "reference_config", liveRow)}</div></div>
        <div class="fact"><div class="k">Memory</div><div class="v num">${fmt(p.hbm_gb_per_accel)}<small>GB</small></div>
          <div class="d">per ${p.vendor === "Cerebras" ? "wafer (SRAM)" : "GPU"}${pLinks.hbm_gb_per_accel ? why(pLinks.hbm_gb_per_accel, "platform", p) : ""}</div></div>
      </div>
    </div>`;

    // ---- network options
    const shown = state.showAll ? runs : runs.slice(0, 3);
    html += `<div class="opts-head"><h3>Network options</h3><p>Best fit first. Power and storage above are the same for every option.</p></div>`;
    shown.forEach((r, i) => { html += optionCard(r, i === 0, p, u); });
    if (runs.length > 3) html += `<button type="button" class="more" id="more">${state.showAll ? "Show the top 3 only" : `Show all ${runs.length} network options`}</button>`;
    out.innerHTML = html;
    const more = $("more");
    if (more) more.addEventListener("click", () => { state.showAll = !state.showAll; render(); });

    $("foot").textContent = DATA.assumptions.disclaimer + " Every figure comes from the Atlas reference dataset; “why?” links explain each one.";
  }

  function optionCard(r, best, p, u) {
    const { f, plan, row } = r;
    const fl = explainLinks("fabric_option", f, DATA);
    const t = plan.network;
    const vendor = !f.switch;
    const family = vendor ? "Cerebras network" : /InfiniBand/.test(f.fabric) ? "InfiniBand" : /Spectrum-X/.test(f.fabric) ? "Spectrum-X Ethernet" : "Open Ethernet";
    const tags = [
      f.recommended ? '<span class="tag rec">Recommended</span>' : "",
      p.vendor === "NVIDIA" && !f.nvidia_validated ? '<span class="tag warn">Not NVIDIA-validated</span>' : "",
      f.note ? '<span class="tag est">Validate with vendor</span>' : "",
    ].join(" ");
    let h = `<article class="option${best ? " best" : ""}">
      <header><h4>${esc(family)}</h4>${why(fl.fabric, "fabric_option", f, "about")} ${tags}</header>
      <p class="tech">${esc(f.tech)}${f.planes > 1 && fl.planes ? ` · ${f.planes} × ${f.plane_gbps}G planes per ${p.vendor === "Cerebras" ? "system" : "GPU"}` + why(fl.planes, "fabric_option", f) : ""}</p>`;

    if (vendor) {
      const max = f.limits.max_gpus_2tier;
      h += max ? gauge(plan.gpus, max, u, why("cerebras-fabric", "fabric_option", f), "Published maximum") : "";
      h += `<p class="verdict">${max && plan.gpus > max ? `<strong>Above the published maximum</strong> of ${fmt(max)} ${u} — discuss with Cerebras.` : "<strong>Network designed and supplied by Cerebras.</strong> Sizing is done with the vendor."}${why("cerebras-fabric", "fabric_option", f, "why?")}</p>`;
      return h + "</article>";
    }

    const ceil = f.limits.max_gpus_2tier;
    h += gauge(plan.gpus, ceil, u, why(fl.max_gpus_2tier, "fabric_option", f));
    if (fl.warning) h += `<p class="note warn">Single 800G planes on 51.2T switches stop at ${fmt(ceil)} GPUs.${why(fl.warning, "fabric_option", f)}</p>`;

    if (t.chosen) {
      const c = t.chosen;
      const tiersTxt = c.tiers === 1 ? "one layer of switches" : "a non-blocking two-layer network";
      h += `<p class="verdict"><strong>Fits in ${tiersTxt}.</strong> ${c.tiers === 2 ? `${fmt(c.per_plane.leaf)} leaf + ${fmt(c.per_plane.spine)} spine switches${f.planes > 1 ? ` in each of ${f.planes} planes` : ""}.` : ""}${why("non-blocking", "fabric_option", f, "non-blocking?")}</p>
      <div class="netgrid">
        <div class="fact"><div class="k">Switches</div><div class="v num">${fmt(c.switches)}</div><div class="d">${esc(byId(DATA.switches, f.switch).name.split(" (")[0])}</div></div>
        <div class="fact"><div class="k">Optics (800G-eq ends)</div><div class="v num">${fmt(c.transceiver_ends_800g_eq)}</div><div class="d">${why("optics-count", "reference_config", row, "why count these?")}</div></div>
        <div class="fact"><div class="k">Switch power</div><div class="v num">${fmt(c.switch_kw)}<small>kW</small></div><div class="d">estimate, incl. optics</div></div>
        <div class="fact"><div class="k">Room to grow</div><div class="v num">${fmt(Math.max(0, ceil - plan.gpus))}</div><div class="d">${u} before the limit</div></div>
      </div>`;
    } else {
      const [A, B] = t.alternatives;
      h += `<p class="verdict"><strong>Exceeds the two-layer limit.</strong> Choose how to grow:${why("beyond-2tier", "fabric_option", f)}</p>
      <div class="alts">
        <div class="alt"><h5>${esc(A.label)}</h5><p>Cheapest. One job cannot span pods at full speed.</p>
          <dl class="num"><dt>Switches</dt><dd>${fmt(A.switches)}</dd><dt>Optics (800G-eq ends)</dt><dd>${fmt(A.transceiver_ends_800g_eq)}</dd><dt>Switch power</dt><dd>${fmt(A.switch_kw)} kW</dd></dl></div>
        <div class="alt"><h5>${esc(B.label)}</h5><p>One flat fabric for one giant job.${why("three-tier-cost", "fabric_option", f, "why it costs more")}</p>
          <dl class="num"><dt>Switches</dt><dd>${fmt(B.switches)}</dd><dt>Optics (800G-eq ends)</dt><dd>${fmt(B.transceiver_ends_800g_eq)}</dd><dt>Switch power</dt><dd>${fmt(B.switch_kw)} kW</dd></dl></div>
      </div>`;
    }
    if (plan.power.allowance_exceeded) {
      h += `<p class="note">Network, storage and CPU add up to ${fmt(plan.power.bottom_up_net_storage_frontend_kw)} kW, above the ${fmt(plan.power.network_and_peripherals_allowance_kw)} kW allowance of the 90/10 rule.${why("power-90-10", "reference_config", row)}</p>`;
    }
    return h + "</article>";
  }

  buildStatic();
  render();
})();

</script>
</body>
</html>
